name: synthetic-tests

on:
  push:
    branches: [main, codex/paper-faithful-reproduction]
  pull_request:

permissions:
  contents: read

jobs:
  gate-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.14"
          cache: pip
      - name: Install frozen build stack, reference, and tests
        run: |
          python -m pip install pip==24.0 setuptools==69.5.1 wheel==0.43.0 Cython==0.29.37 numpy==1.26.4
          python -m pip install --no-build-isolation -e '.[test]'
          python -m pip check
      - name: Run synthetic suite
        run: python -m pytest --cov=esfo --cov-report=term-missing
