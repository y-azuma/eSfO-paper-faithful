[build-system]
requires = [
  "setuptools==69.5.1",
  "wheel==0.43.0",
  "Cython==0.29.37",
  "numpy==1.26.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "esfo-paper-faithful"
version = "0.1.0"
description = "Auditable reproduction of Event-based Structure-from-Orbit"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.0",
  "hdbscan==0.8.33",
  "scikit-learn==1.4.2",
  "joblib==1.4.2",
  "threadpoolctl==3.5.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
  "pytest-cov==5.0.0",
  "coverage[toml]==7.5.1",
  "iniconfig==2.0.0",
  "packaging==24.0",
  "pluggy==1.5.0",
  "exceptiongroup==1.2.1",
  "tomli==2.0.1",
  "typing-extensions==4.11.0",
]
evaluation = ["matplotlib>=3.8,<3.11", "pandas>=2.1,<2.4"]
colmap = ["opencv-python-headless==4.9.0.80"]
gtsam = ["gtsam==4.2"]

[tool.setuptools.packages.find]
include = ["esfo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

