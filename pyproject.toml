[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esfo-paper-faithful"
version = "0.1.0"
description = "Auditable reproduction of Event-based Structure-from-Orbit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11,<1.16",
  "scikit-learn>=1.4,<1.8",
  "hdbscan>=0.8.38,<0.9",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
evaluation = ["matplotlib>=3.8,<3.11", "pandas>=2.1,<2.4"]
gtsam = ["gtsam==4.2"]

[tool.setuptools.packages.find]
include = ["esfo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

